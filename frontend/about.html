}
/* Soft Blue×Pink gradient accents */

}
button.primary, .nx-btn-primary, .btn-login, .btn-primary {

}

}

/* ============================================================
   NovaX Design System 2026 — shared tokens + component library
   Liquid Glass · iOS 26 × Nothing OS · Pink
   ============================================================ */

@font-face{
  font-family:'NovaX';
  src:url('./NovaX_Font.ttf') format('truetype');
  font-display:swap;
}

:root{
  /* ---- surfaces ---- */
  --bg:            #050505;
  --bg-soft:       #0a0a0a;
  --surface-1:     rgba(255,255,255,.06);
  --surface-2:     rgba(255,255,255,.09);
  --surface-3:     rgba(255,255,255,.12);
  --border:        rgba(255,255,255,.10);
  --border-hover:  rgba(255,255,255,.18);
  --border-accent: rgba(255,79,163,.35);

  /* ---- brand green ---- */
  --accent:        #FF4FA3;
  --accent-2:      #FF77C8;
  --accent-dim:    rgba(255,79,163,.12);
  --accent-dim-2:  rgba(255,79,163,.20);
  --accent-glow:   rgba(255,79,163,.45);
  --on-accent:     #1a0a12;

  /* ---- status ---- */
  --danger:        #FF453A;
  --danger-dim:    rgba(251,90,106,.12);
  --warning:       #FFD60A;
  --warning-dim:   rgba(255,182,72,.12);
  --success:       var(--accent);

  /* ---- text ---- */
  --text-1:        #FFFFFF;
  --text-2:        rgba(255,255,255,.78);
  --text-3:        #9E7181;

  /* ---- shape ---- */
  --r-xs:  10px;
  --r-sm:  14px;
  --r-md:  18px;
  --r-lg:  24px;
  --r-xl:  32px;
  --r-full: 999px;

  /* ---- elevation ---- */
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 8px 24px -8px rgba(0,0,0,.55);
  --shadow-3: 0 24px 60px -16px rgba(0,0,0,.65);
  --shadow-glow: 0 0 0 1px var(--border-accent), 0 8px 32px -8px var(--accent-glow);

  /* ---- motion ---- */
  --ease-out:    cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .16s;
  --dur-med:  .32s;
  --dur-slow: .55s;

  /* ---- type ---- */
  --font: 'NovaX',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono: 'NovaX',ui-monospace,monospace;

  /* ---- layout ---- */
  --edge: 20px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }

body{
  background:var(--bg);
  color:var(--text-1);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* ambient background — identical across all screens for brand cohesion */
.nx-ambient{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60% 40% at 18% -8%, rgba(255,79,163,.10) 0%, transparent 60%),
    radial-gradient(50% 40% at 100% 10%, rgba(255,79,163,.05) 0%, transparent 55%),
    radial-gradient(70% 50% at 50% 120%, rgba(255,79,163,.06) 0%, transparent 60%),
    var(--bg);
}
.nx-ambient::after{
  content:'';
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 75% 60% at 50% 0%, black 30%, transparent 100%);
}

::selection{ background:var(--accent-dim-2); color:var(--text-1); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:var(--r-full); }
::-webkit-scrollbar-thumb:hover{ background:var(--border-hover); }

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }

/* ============ layout shells ============ */
.nx-shell{
  width:100%; max-width:440px; margin:0 auto;
  padding: max(24px, var(--safe-t)) var(--edge) calc(32px + var(--safe-b));
  min-height:100vh;
  display:flex; flex-direction:column;
}

.nx-topbar{
  display:flex; align-items:center; gap:12px;
  margin-bottom:28px;
}
.nx-back{
  width:38px; height:38px; flex-shrink:0;
  border-radius:var(--r-full);
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-2);
  cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
  -webkit-tap-highlight-color:transparent;
}
.nx-back:hover{ background:var(--surface-3); color:var(--text-1); border-color:var(--border-hover); }
.nx-back:active{ transform:scale(.92); }

.nx-title{ font-size:17px; font-weight:700; letter-spacing:-.2px; }
.nx-title-sub{ font-size:12px; color:var(--text-3); margin-top:1px; }

/* ============ brand lockup ============ */
.nx-brand{
  font-size:22px; font-weight:800; letter-spacing:1.5px;
  color:var(--text-1);
}
.nx-brand em{
  font-style:normal;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

/* ============ glass card ============ */
.nx-card{
  position:relative;
  background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface-1) 100%);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);
  padding:22px;
}
.nx-card::before{
  content:'';
  position:absolute; top:0; left:16px; right:16px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
}
.nx-card + .nx-card{ margin-top:14px; }

/* ============ buttons ============ */
.nx-btn{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  width:100%; padding:15px 20px;
  font-family:var(--font); font-size:14.5px; font-weight:700; letter-spacing:-.1px;
  border-radius:var(--r-sm);
  border:1px solid transparent;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast), opacity var(--dur-fast);
  will-change:transform;
}
.nx-btn:active{ transform:scale(.965); }
.nx-btn:disabled{ opacity:.45; pointer-events:none; }

.nx-btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  box-shadow:0 4px 20px -4px var(--accent-glow);
}
.nx-btn-primary:hover{ filter:brightness(1.08); box-shadow:0 6px 26px -4px var(--accent-glow); }

.nx-btn-secondary{
  background:var(--surface-2);
  border-color:var(--border);
  color:var(--text-1);
}
.nx-btn-secondary:hover{ background:var(--surface-3); border-color:var(--border-hover); }

.nx-btn-ghost{
  background:transparent;
  color:var(--text-2);
}
.nx-btn-ghost:hover{ background:var(--surface-1); color:var(--text-1); }

.nx-btn-danger{
  background:var(--danger-dim);
  border-color:rgba(251,90,106,.28);
  color:var(--danger);
}
.nx-btn-danger:hover{ background:rgba(251,90,106,.18); }

.nx-btn-sm{ padding:10px 16px; font-size:13px; width:auto; border-radius:var(--r-xs); }

/* ripple */
.nx-ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); animation:nx-ripple .6s var(--ease-out); pointer-events:none; }
@keyframes nx-ripple{ to{ transform:scale(3); opacity:0; } }

/* spinner */
.nx-spinner{ width:17px; height:17px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:currentColor; animation:nx-spin .7s linear infinite; display:none; }
.nx-btn.is-loading .nx-spinner{ display:inline-block; }
.nx-btn.is-loading .nx-btn-label{ display:none; }
@keyframes nx-spin{ to{ transform:rotate(360deg); } }

/* ============ inputs ============ */
.nx-field{ margin-bottom:16px; }
.nx-label{
  display:block; font-size:12.5px; font-weight:600; color:var(--text-2);
  margin-bottom:7px; letter-spacing:.1px;
}
.nx-input-wrap{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-1);
  border:1.5px solid var(--border);
  border-radius:var(--r-sm);
  padding:0 14px;
  transition:border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast), background var(--dur-fast);
}
.nx-input-wrap:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-dim);
  background:var(--surface-2);
}
.nx-input-wrap svg{ color:var(--text-3); flex-shrink:0; transition:color var(--dur-fast); }
.nx-input-wrap:focus-within svg{ color:var(--accent); }
.nx-input-wrap input, .nx-input-wrap select, .nx-input-wrap textarea{
  width:100%; background:transparent; border:none; outline:none;
  color:var(--text-1); font-family:var(--font); font-size:14.5px; font-weight:500;
  padding:14px 0;
}
.nx-input-wrap textarea{ resize:none; padding:12px 0; }
.nx-input-wrap input::placeholder{ color:var(--text-3); }
.nx-input-icon-btn{ background:none; border:none; color:var(--text-3); cursor:pointer; display:flex; padding:4px; -webkit-tap-highlight-color:transparent; transition:color var(--dur-fast); }
.nx-input-icon-btn:hover{ color:var(--text-1); }
.nx-hint{ font-size:11.5px; color:var(--text-3); margin-top:6px; }
.nx-hint.is-error{ color:var(--danger); }

/* checkbox / toggle */
.nx-check{
  width:20px; height:20px; border-radius:6px;
  border:1.5px solid var(--border-hover);
  display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-fast) var(--ease-out); cursor:pointer; flex-shrink:0;
}
.nx-check.is-checked{ background:var(--accent); border-color:var(--accent); }
.nx-check svg{ opacity:0; transform:scale(.5); transition:all var(--dur-fast) var(--ease-spring); }
.nx-check.is-checked svg{ opacity:1; transform:scale(1); }

.nx-switch{ width:42px; height:25px; border-radius:var(--r-full); background:var(--surface-3); border:1px solid var(--border); position:relative; cursor:pointer; transition:background var(--dur-med) var(--ease-out); flex-shrink:0; }
.nx-switch::after{ content:''; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--text-2); transition:all var(--dur-med) var(--ease-spring); }
.nx-switch.is-on{ background:var(--accent-dim-2); border-color:var(--border-accent); }
.nx-switch.is-on::after{ transform:translateX(17px); background:var(--accent); box-shadow:0 0 12px var(--accent-glow); }

/* ============ badge ============ */
.nx-badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:var(--r-full);
  font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  background:var(--accent-dim); color:var(--accent-2); border:1px solid var(--border-accent);
}
.nx-badge-mono{ font-family:var(--font-mono); text-transform:none; letter-spacing:.5px; }
.nx-badge-danger{ background:var(--danger-dim); color:var(--danger); border-color:rgba(251,90,106,.3); }
.nx-badge-warning{ background:var(--warning-dim); color:var(--warning); border-color:rgba(255,182,72,.3); }
.nx-badge-neutral{ background:var(--surface-3); color:var(--text-2); border-color:var(--border); }

/* ============ avatar ============ */
.nx-avatar{
  width:40px; height:40px; border-radius:var(--r-sm);
  background:var(--accent-dim); border:1px solid var(--border-accent);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent-2); font-weight:800; font-size:15px; flex-shrink:0;
}

/* ============ list row ============ */
.nx-row{
  display:flex; align-items:center; gap:13px;
  padding:14px 4px; cursor:pointer;
  border-radius:var(--r-sm);
  transition:background var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color:transparent;
}
.nx-row:hover{ background:var(--surface-1); }
.nx-row:active{ background:var(--surface-2); }
.nx-row-body{ flex:1; min-width:0; }
.nx-row-title{ font-size:14.5px; font-weight:600; color:var(--text-1); }
.nx-row-sub{ font-size:12px; color:var(--text-3); margin-top:2px; }
.nx-row-chevron{ color:var(--text-3); flex-shrink:0; transition:transform var(--dur-fast); }
.nx-row:hover .nx-row-chevron{ transform:translateX(2px); }

/* ============ modal / bottom sheet ============ */
.nx-overlay{
  position:fixed; inset:0; z-index:900;
  background:rgba(6,9,8,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-med) var(--ease-out);
}
.nx-overlay.is-open{ opacity:1; pointer-events:auto; }
.nx-sheet{
  width:100%; max-width:440px;
  background:var(--surface-1);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:28px 28px 0 0;
  padding:10px 22px calc(26px + var(--safe-b));
  transform:translateY(100%);
  transition:transform var(--dur-med) var(--ease-spring);
  box-shadow:var(--shadow-3);
  max-height:86vh; overflow-y:auto;
}
.nx-overlay.is-open .nx-sheet{ transform:translateY(0); }
.nx-sheet-handle{ width:36px; height:4px; border-radius:var(--r-full); background:var(--border-hover); margin:6px auto 18px; }
.nx-sheet-title{ font-size:18px; font-weight:800; margin-bottom:4px; }
.nx-sheet-sub{ font-size:12.5px; color:var(--text-3); margin-bottom:18px; }

/* centered dialog variant */
.nx-overlay.nx-center{ align-items:center; }
.nx-dialog{
  width:calc(100% - 48px); max-width:360px;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:26px 22px; box-shadow:var(--shadow-3); text-align:center;
  transform:scale(.92) translateY(8px); opacity:0;
  transition:all var(--dur-med) var(--ease-spring);
}

/* ============ toast ============ */
.nx-toast-stack{

.nx-toast.is-leaving{ animation:nx-toast-out var(--dur-fast) var(--ease-out) forwards; }

/* ============ divider ============ */
.nx-divider{ height:1px; background:var(--border); margin:18px 0; }
.nx-divider-label{ display:flex; align-items:center; gap:12px; font-size:11px; color:var(--text-3); letter-spacing:1px; text-transform:uppercase; margin:20px 0; }
.nx-divider-label::before, .nx-divider-label::after{ content:''; flex:1; height:1px; background:var(--border); }

/* ============ section label ============ */

/* ============ utility animations ============ */

@keyframes nx-fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes nx-scale-in{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:scale(1); } }
@keyframes nx-blur-in{ from{ opacity:0; filter:blur(8px); } to{ opacity:1; filter:blur(0); } }
@keyframes nx-float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
.nx-anim-in{ animation:nx-fade-up var(--dur-slow) var(--ease-out) both; }
.nx-anim-in-1{ animation-delay:.05s; } .nx-anim-in-2{ animation-delay:.1s; } .nx-anim-in-3{ animation-delay:.16s; }

/* ============ screen transition (for multi-screen flows) ============ */

</style>

</div><!-- /.nx-app-root --><script id="nx-bgm-main">

(function(){
if(window.__nxBgm)return;
var TRACKS=[
{id:'track1',name:'NovaX Theme A',url:'https://files.catbox.moe/7ns7pa.m4a'},
{id:'track2',name:'NovaX Theme B',url:'https://files.catbox.moe/dcs4ls.m4a'}
];
var path=(location.pathname||'').toLowerCase();
var isSplash=path.indexOf('splash')!==-1;
var isIklan=path.indexOf('iklan')!==-1;
function getTrack(id){
for(var i=0;i<TRACKS.length;i++)if(TRACKS[i].id===id)return TRACKS[i];
return TRACKS[0];
}
var audio=document.createElement('audio');
audio.id='nx-bgm-audio';audio.preload='auto';audio.style.display='none';
document.body.appendChild(audio);
var trackId=localStorage.getItem('nx_bgm_track')||'track1';
var vol=parseFloat(localStorage.getItem('nx_bgm_vol')||'0.45');
if(isNaN(vol))vol=0.45;
var paused=localStorage.getItem('nx_bgm_paused')==='1';
var loopOn=localStorage.getItem('nx_bgm_loop')!=='0';
var tpos=parseFloat(localStorage.getItem('nx_bgm_time')||'0');
audio.loop=loopOn;audio.volume=vol;
function saveTime(){try{if(!isNaN(audio.currentTime))localStorage.setItem('nx_bgm_time',String(audio.currentTime));}catch(e){}}
function load(id,resume){
var t=getTrack(id);trackId=t.id;localStorage.setItem('nx_bgm_track',t.id);
var file=t.url.split('/').pop();
if(!audio.src||audio.src.indexOf(file)===-1)audio.src=t.url;
audio.loop=loopOn;audio.volume=vol;
if(resume&&tpos>0.5){
var once=function(){audio.removeEventListener('loadedmetadata',once);try{audio.currentTime=tpos;}catch(e){}};
audio.addEventListener('loadedmetadata',once);
}
ui();
}
function play(){paused=false;localStorage.setItem('nx_bgm_paused','0');var p=audio.play();if(p&&p.catch)p.catch(function(){});ui();}
function pause(){paused=true;localStorage.setItem('nx_bgm_paused','1');audio.pause();saveTime();ui();}
function toggle(){if(audio.paused)play();else pause();}
function selectTrack(id){saveTime();tpos=0;localStorage.setItem('nx_bgm_time','0');load(id,false);play();}
function setVol(v){vol=Math.max(0,Math.min(1,v));audio.volume=vol;localStorage.setItem('nx_bgm_vol',String(vol));ui();}
function setLoop(on){loopOn=!!on;audio.loop=loopOn;localStorage.setItem('nx_bgm_loop',loopOn?'1':'0');ui();}
function ui(){
var now=document.getElementById('nx-bgm-now');
if(now)now.textContent=getTrack(trackId).name+(audio.paused?' · paused':' · playing');
var list=document.querySelectorAll('.nx-bgm-track');
for(var i=0;i<list.length;i++)list[i].classList.toggle('active',list[i].getAttribute('data-id')===trackId);
var pb=document.getElementById('nx-bgm-playbtn');if(pb)pb.textContent=audio.paused?'\u25B6':'\u23F8';
var lb=document.getElementById('nx-bgm-loopbtn');if(lb)lb.style.opacity=loopOn?'1':'.4';
var vr=document.getElementById('nx-bgm-range');if(vr)vr.value=String(vol);
var vt=document.getElementById('nx-bgm-volt');if(vt)vt.textContent=Math.round(vol*100)+'%';
var fab=document.getElementById('nx-bgm-fab');if(fab)fab.classList.toggle('paused',audio.paused);
}
window.__nxBgm={play:play,pause:pause,toggle:toggle,selectTrack:selectTrack,setVol:setVol,setLoop:setLoop,ui:ui};

if(isSplash){
try{audio.pause();}catch(e){}
localStorage.setItem('nx_bgm_paused','1');
paused=true;
return;
}

load(trackId,true);
if(isIklan){paused=false;localStorage.setItem('nx_bgm_paused','0');}
if(!paused)setTimeout(function(){play();},300);
setInterval(saveTime,3000);
window.addEventListener('beforeunload',saveTime);
function unlock(){if(!paused&&audio.paused)play();document.removeEventListener('touchstart',unlock);document.removeEventListener('click',unlock);}
document.addEventListener('touchstart',unlock,{passive:true});
document.addEventListener('click',unlock);

function mountUI(){
if(document.getElementById('nx-bgm-fab'))return;
var panel=document.createElement('div');
panel.className='nx-bgm-panel';panel.id='nx-bgm-panel';
panel.innerHTML='<div class="nx-bgm-head">BACKGROUND MUSIC</div><div class="nx-bgm-now" id="nx-bgm-now">-</div><div class="nx-bgm-tracks"><button type="button" class="nx-bgm-track" data-id="track1">\uD83C\uDFB5 NovaX Theme A</button><button type="button" class="nx-bgm-track" data-id="track2">\uD83C\uDFB5 NovaX Theme B</button></div><div class="nx-bgm-row"><button type="button" id="nx-bgm-playbtn">\u25B6</button><button type="button" id="nx-bgm-loopbtn">\uD83D\uDD01</button><span class="nx-bgm-vol-txt" id="nx-bgm-volt">45%</span><input id="nx-bgm-range" type="range" min="0" max="1" step="0.01" value="0.45"/></div>';
document.body.appendChild(panel);
var fab=document.createElement('button');
fab.type='button';fab.id='nx-bgm-fab';fab.className='nx-bgm-fab';fab.textContent='\u266A';
document.body.appendChild(fab);
fab.onclick=function(e){e.preventDefault();e.stopPropagation();panel.classList.toggle('open');};
panel.querySelectorAll('.nx-bgm-track').forEach(function(btn){btn.onclick=function(){__nxBgm.selectTrack(btn.getAttribute('data-id'));};});
document.getElementById('nx-bgm-playbtn').onclick=function(){__nxBgm.toggle();};
document.getElementById('nx-bgm-loopbtn').onclick=function(){__nxBgm.setLoop(localStorage.getItem('nx_bgm_loop')==='0');};
document.getElementById('nx-bgm-range').oninput=function(ev){__nxBgm.setVol(parseFloat(ev.target.value));};
document.addEventListener('click',function(ev){if(!panel.contains(ev.target)&&ev.target!==fab)panel.classList.remove('open');});
ui();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mountUI);
else mountUI();
})();

</script>
