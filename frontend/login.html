<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NovaX — Login</title>
<style>
@font-face{font-family:'NovaX';src:url('./NovaX_Font.ttf') format('truetype');font-weight:400 700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'NovaX',sans-serif;
  color:#e2e8f0;-webkit-font-smoothing:antialiased;
  position:fixed;inset:0;background:#070B14;
}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.bg-glow{
  position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(100px)}
.bg-glow::before{
  top:8%;left:8%;width:55vw;height:55vw;max-width:400px;max-height:400px;
  background:rgba(85,184,255,.28);
}
.bg-glow::after{
  bottom:8%;right:8%;width:50vw;height:50vw;max-width:360px;max-height:360px;
  background:rgba(255,95,162,.22);
}
.bg-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(160deg,rgba(7,11,20,.4),rgba(7,11,20,.55));
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}

.login-container{
  position:relative;z-index:2;
  width:min(92vw,460px);height:100%;
  margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,2.5vh,22px);
  padding:16px 0 24px;
  animation:loginEnter .5s ease-out both;
}
@keyframes loginEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.login-header{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px)}
.logo-circle{
  width:clamp(90px,14vw,106px);height:clamp(90px,14vw,106px);
  border-radius:50%;
  background:linear-gradient(145deg,rgba(85,184,255,.2),rgba(255,95,162,.15));
  border:1.5px solid rgba(85,184,255,.35);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  box-shadow:0 0 40px rgba(85,184,255,.25);
  margin-bottom:clamp(4px,1vh,10px);
}
.logo-circle svg{width:42px;height:42px;color:#55B8FF}
.brand-name{
  font-size:clamp(20px,5.5vw,28px);font-weight:800;
  letter-spacing:.22em;
  background:linear-gradient(90deg,#55B8FF,#FF5FA2);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.brand-sub{font-size:clamp(9px,2.2vw,12px);letter-spacing:.28em;color:rgba(255,255,255,.4)}

/* Plate / card shell */
.card{position:relative;width:100%}
.nameplate-shell{
  position:relative;width:100%;
  background:linear-gradient(160deg,rgba(18,28,48,.92) 0%,rgba(10,14,28,.95) 100%);
  border:1.5px solid rgba(85,184,255,.35);
  border-radius:18px;
  box-shadow:
    0 16px 48px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,95,162,.08),
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 32px rgba(85,184,255,.1);
  overflow:hidden;
}
.nameplate-shell::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(85,184,255,.5),rgba(255,95,162,.4),transparent);
}
.nameplate-shell::after{
  content:'';position:absolute;inset:10px;border-radius:12px;
  border:1px solid rgba(85,184,255,.1);pointer-events:none;
}
.card-content{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:28px clamp(22px,6vw,40px) 24px;
}
.card-header{text-align:center;margin-bottom:6px}
.card-title{font-size:clamp(16px,4.2vw,20px);font-weight:800;color:#f0f9ff;letter-spacing:.1em}
.card-subtitle{font-size:clamp(9px,2.2vw,11px);color:rgba(255,255,255,.45);letter-spacing:.1em;margin-top:4px}
.card-divider{width:100%;display:flex;align-items:center;gap:8px;margin:12px 0 16px}
.card-divider-line{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(85,184,255,.3),transparent)}
.card-divider-diamond{
  width:6px;height:6px;flex-shrink:0;
  background:linear-gradient(135deg,#55B8FF,#FF5FA2);
  transform:rotate(45deg);opacity:.7;
}

.card-form{width:100%}
.input-group{
  display:flex;align-items:center;
  background:rgba(7,11,20,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:10px;
  border:1px solid rgba(85,184,255,.2);
  transition:border-color .25s,box-shadow .25s;
  margin-bottom:clamp(12px,2vh,16px);
}
.input-group:focus-within{
  border-color:rgba(85,184,255,.55);
  box-shadow:0 0 0 3px rgba(85,184,255,.12);
}
.input-group:focus-within .input-icon{color:#55B8FF}
.input-icon{
  padding:0 10px 0 13px;color:rgba(255,255,255,.4);
  display:flex;align-items:center;flex-shrink:0;transition:color .25s;
}
.input-icon svg{width:15px;height:15px}
.input-group input{
  flex:1;background:transparent;border:none;outline:none;
  font-family:inherit;font-size:clamp(12px,3vw,14px);color:#f0f9ff;
  padding:clamp(12px,2.2vh,15px) 12px clamp(12px,2.2vh,15px) 0;
}
.input-group input::placeholder{color:rgba(255,255,255,.32)}
.eye-btn{
  background:none;border:none;cursor:pointer;padding:0 12px;
  color:rgba(255,255,255,.4);display:flex;align-items:center;flex-shrink:0;
}
.eye-btn:hover{color:#55B8FF}
.eye-btn svg{width:16px;height:16px}

/* Save credentials — toggle BUTTON style */
.save-toggle{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  margin-bottom:16px;
  border-radius:12px;
  cursor:pointer;user-select:none;
  background:rgba(85,184,255,.06);
  border:1px solid rgba(85,184,255,.2);
  transition:all .22s ease;
}
.save-toggle:active{transform:scale(.985)}
.save-toggle.on{
  background:linear-gradient(135deg,rgba(85,184,255,.16),rgba(255,95,162,.1));
  border-color:rgba(85,184,255,.45);
  box-shadow:0 0 18px rgba(85,184,255,.15);
}
.save-toggle-left{display:flex;align-items:center;gap:10px;min-width:0}
.save-toggle-icon{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(85,184,255,.12);border:1px solid rgba(85,184,255,.25);
  color:#55B8FF;font-size:14px;
}
.save-toggle.on .save-toggle-icon{
  background:linear-gradient(135deg,rgba(85,184,255,.3),rgba(255,95,162,.2));
  border-color:rgba(85,184,255,.4);color:#fff;
}
.save-toggle-text{display:flex;flex-direction:column;gap:2px}
.save-toggle-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.03em}
.save-toggle.on .save-toggle-title{color:#fff}
.save-toggle-sub{font-size:10px;color:rgba(255,255,255,.35)}
.save-switch{
  width:44px;height:24px;border-radius:20px;flex-shrink:0;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  position:relative;transition:background .22s,border-color .22s;
}
.save-toggle.on .save-switch{
  background:linear-gradient(90deg,#55B8FF,#FF5FA2);
  border-color:transparent;
  box-shadow:0 0 12px rgba(85,184,255,.35);
}
.save-switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform .22s cubic-bezier(.22,1,.36,1);
}
.save-toggle.on .save-switch::after{transform:translateX(20px)}
/* hide real checkbox */
.save-toggle input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}

/* Sign in button plate */
.card-btn{width:100%}
.nameplate-shell--btn{
  cursor:pointer;transition:transform .15s ease;
  background:linear-gradient(160deg,rgba(30,80,120,.5) 0%,rgba(80,30,70,.4) 100%);
  border-color:rgba(85,184,255,.4);
}
.nameplate-shell--btn:active{transform:scale(.98)}
.card-btn-content{position:relative;z-index:1;padding:4px}
.btn-signin{
  width:100%;padding:16px;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.14em;
  color:#fff;text-transform:uppercase;
  background:linear-gradient(135deg,#55B8FF 0%,#7B8CFF 50%,#FF5FA2 100%);
  box-shadow:0 8px 28px rgba(85,184,255,.3),0 0 16px rgba(255,95,162,.12);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:opacity .2s;
}
.btn-signin:disabled{opacity:.65;cursor:wait}
.btn-signin .btn-loader{
  width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
.btn-signin.loading .btn-loader{display:block}
.btn-signin.loading .btn-label,
.btn-signin.loading .btn-arrow{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-footer{text-align:center}
.footer-team{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.35);margin-bottom:6px;
}
.footer-line{width:36px;height:1px;background:linear-gradient(90deg,transparent,rgba(85,184,255,.35),transparent)}
.footer-ver{font-size:10px;color:rgba(255,255,255,.25)}
.helper-links{display:flex;justify-content:center;gap:18px;margin-top:4px}
.helper-links a{font-size:11px;color:rgba(85,184,255,.65);text-decoration:none}
.helper-links a:hover{color:#FF5FA2}

.toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,360px)}
.toast{
  display:flex;gap:10px;padding:12px 14px;border-radius:14px;
  background:rgba(12,16,32,.9);backdrop-filter:blur(16px);
  border:1px solid rgba(255,95,162,.35);
  box-shadow:0 12px 32px rgba(0,0,0,.45);
  animation:loginEnter .3s ease both;
}
.toast.success{border-color:rgba(85,184,255,.4)}
.toast.hide{opacity:0;transform:translateY(-8px);transition:.25s}
.toast-icon{color:#FF5FA2;flex-shrink:0}
.toast.success .toast-icon{color:#55B8FF}
.toast-title{font-size:13px;font-weight:700;color:#fff}
.toast-msg{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
</style>

/* Hide dark ambient layers */

<script>
(function checkAutoLogin(){
  var remember = localStorage.getItem('sync_remember') === '1';
  var token = localStorage.getItem('sync_token');
  if (remember && token) {
    window.location.replace('splash.html');
    return;
  }
})();

function syncSaveUI(){
  var cb = document.getElementById('rememberMe');
  var el = document.getElementById('saveToggle');
  if (cb && el) el.classList.toggle('on', cb.checked);
}

function toggleSave(e){
  if (e && e.target && e.target.id === 'rememberMe') return;
  var cb = document.getElementById('rememberMe');
  cb.checked = !cb.checked;
  syncSaveUI();
}

function loadSavedCreds() {
  var saved = localStorage.getItem('sync_saved_creds');
  if (saved) {
    try {
      var data = JSON.parse(atob(saved));
      document.getElementById('username').value = data.username || '';
      document.getElementById('password').value = data.password || '';
    } catch(e){}
  }
  if (localStorage.getItem('sync_remember') === '1') {
    document.getElementById('rememberMe').checked = true;
  }
  syncSaveUI();
}

function togglePwd() {
  var inp = document.getElementById('password');
  var icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showToast(type, title, msg) {
  var wrap = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var iconPath = type === 'success'
    ? '<circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>'
    : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-width="3"/>';
  t.innerHTML = '<div class="toast-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' + iconPath + '</svg></div><div style="min-width:0;flex:1"><div class="toast-title">' + title + '</div><div class="toast-msg">' + msg + '</div></div>';
  wrap.appendChild(t);
  var box = document.getElementById('loginErrorBox');
  if (box && type === 'error') {
    box.innerHTML = '<div class="title">' + title + '</div><div class="msg">' + msg + '</div>';
    box.classList.add('show');
  } else if (box && type === 'success') {
    box.classList.remove('show');
    box.innerHTML = '';
  }
  setTimeout(function(){ t.classList.add('hide'); setTimeout(function(){ t.remove(); }, 300); }, type === 'error' ? 6000 : 3000);
}

async function doLogin() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var remember = document.getElementById('rememberMe').checked;
  var btn = document.getElementById('loginBtn');

  if (!username || !password) {
    showToast('error', 'Gagal Masuk', 'Username dan password tidak boleh kosong');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    var deviceId = localStorage.getItem('sync_device_id');
    if (!deviceId) {
      deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('sync_device_id', deviceId);
    }

    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password, deviceId: deviceId })
    });
    var data = await res.json();

    if (data.ok) {
      localStorage.setItem('sync_token', data.token);
      localStorage.setItem('sync_user', data.username);
      if (data.role) localStorage.setItem('sync_role', data.role);

      if (remember) {
        localStorage.setItem('sync_remember', '1');
        localStorage.setItem('sync_saved_creds', btoa(JSON.stringify({ username: username, password: password })));
      } else {
        localStorage.removeItem('sync_remember');
        localStorage.removeItem('sync_saved_creds');
      }

      window.location.href = 'splash.html';
    } else {
      showToast('error', 'Gagal Masuk', data.error || 'Username atau password salah');
      btn.disabled = false;
      btn.classList.remove('loading');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  } catch (err) {
    showToast('error', 'Koneksi Gagal', 'Tidak bisa konek ke server');
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

document.getElementById('username').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

loadSavedCreds();
if (!document.getElementById('username').value) {
  document.getElementById('username').focus();
}
</script>
