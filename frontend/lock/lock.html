<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovaX Warning</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --black:#111111;
  --white:#ffffff;
  --bg:#f2f1eb;
  --yellow:#ffd21f;
  --blue:#1557d6;
}

body{
  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(21,87,214,.10),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(255,210,31,.18),
      transparent 30%
    ),
    var(--bg);

  color:var(--black);

  font-family:
    Consolas,
    "Courier New",
    monospace;

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:100vh;

  overflow:hidden;

  padding:20px;
}

/* =========================
   DECORATION
========================= */

body::before{
  content:"";

  position:fixed;
  inset:0;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 5px,
      rgba(17,17,17,.025) 5px,
      rgba(17,17,17,.025) 6px
    );

  pointer-events:none;
}

body::after{
  content:"NOVAX // SECURITY";

  position:fixed;

  top:18px;
  left:20px;

  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;

  color:var(--black);

  background:var(--yellow);

  border:2px solid var(--black);

  padding:6px 10px;

  box-shadow:
    4px 4px 0 var(--black);
}

/* =========================
   MAIN BOX
========================= */

.box{
  position:relative;

  z-index:2;

  width:100%;
  max-width:700px;

  text-align:center;

  padding:42px 35px;

  background:var(--white);

  border:4px solid var(--black);

  border-radius:12px;

  box-shadow:
    10px 10px 0 var(--black);

  transform:rotate(-.5deg);
}

/* =========================
   WARNING ICON
========================= */

.skull{
  display:flex;

  align-items:center;
  justify-content:center;

  width:105px;
  height:105px;

  margin:0 auto 20px;

  font-size:65px;

  color:var(--black);

  background:var(--yellow);

  border:4px solid var(--black);

  box-shadow:
    7px 7px 0 var(--black);

  animation:shake 2.5s infinite;
}

@keyframes shake{

  0%,90%,100%{
    transform:rotate(0);
  }

  92%{
    transform:rotate(-4deg);
  }

  94%{
    transform:rotate(4deg);
  }

  96%{
    transform:rotate(-2deg);
  }

}

/* =========================
   LOGO
========================= */

.logo{
  display:inline-block;

  font-family:
    Arial,
    sans-serif;

  font-size:60px;

  font-weight:900;

  letter-spacing:-4px;

  color:var(--black);

  background:var(--yellow);

  padding:4px 18px;

  border:4px solid var(--black);

  box-shadow:
    7px 7px 0 var(--blue);

  margin:8px 0 25px;
}

/* =========================
   WARNING
========================= */

.warning{
  display:inline-block;

  font-family:
    Arial,
    sans-serif;

  font-size:30px;

  font-weight:900;

  letter-spacing:-1px;

  color:var(--white);

  background:var(--blue);

  border:4px solid var(--black);

  padding:10px 18px;

  box-shadow:
    6px 6px 0 var(--black);

  margin-bottom:25px;
}

/* =========================
   TEXT
========================= */

.text{
  color:#333;

  font-size:17px;

  font-weight:600;

  line-height:1.8;
}

.text br + br{
  line-height:2;
}

/* =========================
   HAHAHA
========================= */

.text::after{
  content:"";

  display:block;

  width:90px;
  height:8px;

  margin:25px auto 0;

  background:var(--yellow);

  border:2px solid var(--black);

  box-shadow:
    4px 4px 0 var(--black);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

  .box{
    padding:30px 20px;

    box-shadow:
      7px 7px 0 var(--black);
  }

  .skull{
    width:85px;
    height:85px;

    font-size:50px;
  }

  .logo{
    font-size:44px;

    letter-spacing:-3px;

    box-shadow:
      5px 5px 0 var(--blue);
  }

  .warning{
    font-size:22px;

    box-shadow:
      4px 4px 0 var(--black);
  }

  .text{
    font-size:14px;
  }

  body::after{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="skull">☠</div>

  <div class="logo">
    NovaX
  </div>

  <div class="warning">
    SYSTEM LOCKED
  </div>

  <div class="text">
    Unauthorized access detected.<br>
    Please contact your administrator.<br><br>

    <strong>HAHAHAHAHA</strong>
  </div>

</div>

</body>
</html>
