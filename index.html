<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Diri - Daim</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Press Start 2P',monospace;image-rendering:pixelated}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(#0a0f2c 0%,#1b2a5e 55%,#3a5a9e 100%);color:#fff;font-size:10px;line-height:1.9}
.star{position:absolute;width:4px;height:4px;background:#fff;animation:tw 2s infinite steps(2)}
@keyframes tw{50%{opacity:.2}}
.moon{position:absolute;top:30px;right:30px;width:48px;height:48px;background:#f4f1c9;box-shadow:inset -8px -8px 0 #d8d3a0,0 0 0 4px #0003}
.cloud{position:absolute;height:24px;background:#fff;opacity:.85;box-shadow:24px -16px 0 #fff,48px 0 0 #fff;animation:mv linear infinite}
@keyframes mv{from{left:-140px}to{left:110%}}
.ground{position:absolute;left:0;right:0;bottom:0;height:22%;
 background:
  linear-gradient(#5db03a 0 24px,transparent 24px),
  linear-gradient(90deg,#6b4a2b 50%,#5e4125 50%);
 background-size:100% 100%,32px 32px;border-top:6px solid #3b7a22}
.ground:before{content:"";position:absolute;top:0;left:0;right:0;height:24px;
 background:linear-gradient(90deg,#4f9c2f 50%,#5db03a 50%);background-size:32px 24px}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:18px}
.title{font-size:16px;text-shadow:4px 4px 0 #000;text-align:center;color:#ffd53d}
.card{width:100%;max-width:460px;background:#8b8b8b;border:4px solid #000;padding:18px;color:#111;
 box-shadow:inset -5px -5px 0 #555,inset 5px 5px 0 #c6c6c6,6px 6px 0 #0008}
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avatar{width:64px;height:64px;flex:none;border:4px solid #000;
 background:
  linear-gradient(#000 0 0) 14px 26px/12px 10px no-repeat,
  linear-gradient(#000 0 0) 38px 26px/12px 10px no-repeat,
  linear-gradient(#5a3a1a 0 0) 0 0/100% 18px no-repeat,
  #c68e5b}
.nama{font-size:15px;color:#000}
.tag{display:inline-block;background:#c0392b;color:#fff;border:3px solid #000;padding:2px 6px;font-size:8px;margin-top:6px}
.row{font-size:9px;margin:4px 0;color:#222}
.row b{color:#000}
.dialog{background:#000;border:4px solid #fff;color:#fff;padding:14px;min-height:150px;font-size:10px;line-height:2;text-shadow:2px 2px 0 #333;
 box-shadow:6px 6px 0 #0008;width:100%;max-width:460px;position:relative}
.dialog:after{content:"▼";position:absolute;right:10px;bottom:6px;color:#ffd53d;animation:bl .8s infinite steps(2)}
@keyframes bl{50%{opacity:0}}
.hl{color:#ff5555}.gr{color:#7fe24a}.gd{color:#ffd53d}
.btn{background:#5db03a;border:4px solid #000;color:#fff;font-size:10px;padding:12px 16px;cursor:pointer;
 box-shadow:inset -4px -4px 0 #3b7a22,inset 4px 4px 0 #8ee060;text-shadow:2px 2px 0 #1d4a0e}
.btn:active{transform:translate(2px,2px)}
</style>
</head>
<body>
<div class="moon"></div>
<div class="cloud" style="top:90px;width:24px;animation-duration:40s"></div>
<div class="cloud" style="top:160px;width:24px;animation-duration:60s;animation-delay:-20s"></div>
<div class="ground"></div>

<div class="wrap">
  <div class="title">⛏️ DATA DIRI</div>

  <div class="card">
    <div class="head">
      <div class="avatar"></div>
      <div>
        <div class="nama">DAIM</div>
        <span class="tag">HACKER</span>
      </div>
    </div>
    <div class="row"><b>Grup:</b> TNS (Pemilik)</div>
    <div class="row"><b>Bidang:</b> Peretasan</div>
    <div class="row"><b>Level:</b> Hacker Kelas Kakap Internasional</div>
  </div>

  <div class="dialog" id="dlg"></div>
  <button class="btn" onclick="ulang()">▶ ULANGI</button>
</div>

<script>
// bintang acak
for(let i=0;i<40;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*55+"%";
  s.style.animationDelay=Math.random()*2+"s";
  document.body.prepend(s);
}

const teks = [
  "Siap itu <span class='gd'>Daim</span>.",
  "Daim adalah kelompok <span class='hl'>Hacker berbahaya</span>, ahli peretasan.",
  "Pemilik Group <span class='gd'>TNS</span>.",
  "Dia sering di-bully...",
  "Tapi dia <span class='gr'>BANGKIT</span>.",
  "Menjadi <span class='gd'>Hacker kelas kakap Internasional</span>."
];

let timer;
function ulang(){
  clearInterval(timer);
  const d = document.getElementById("dlg");
  d.innerHTML = "";
  let baris = 0;
  function tulis(){
    if(baris >= teks.length) return;
    const p = document.createElement("div");
    d.appendChild(p);
    const plain = teks[baris].replace(/<[^>]+>/g,"").length;
    const html = teks[baris];
    let n = 0;
    timer = setInterval(()=>{
      n++;
      p.innerHTML = potong(html, n);
      if(n >= plain){
        clearInterval(timer);
        baris++;
        setTimeout(tulis, 350);
      }
    }, 40);
  }
  tulis();
}

// potong HTML berdasarkan jumlah karakter terlihat
function potong(html, n){
  let out = "", vis = 0, tag = false, buka = [];
  for(const c of html){
    if(c==="<") tag = true;
    if(tag){
      out += c;
      if(c===">") tag = false;
      continue;
    }
    if(vis >= n) break;
    out += c; vis++;
  }
  return out + (out.includes("<span")&&!out.endsWith("</span>")?"</span>":"");
}

ulang();
</script>
</body>
</html>
