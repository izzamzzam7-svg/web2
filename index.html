<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesawat 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --sky: #87ceeb;
  --ink: #1b2a3a;
  --panel: rgba(255, 255, 255, 0.92);
  --hud: #ffffff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--sky);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #eaf2fb;
    --panel: rgba(20, 30, 45, 0.92);
  }
}
:root[data-theme="dark"] {
  --ink: #eaf2fb;
  --panel: rgba(20, 30, 45, 0.92);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body { position: relative; background: var(--sky); color: var(--ink); }
canvas { display: block; width: 100%; height: 100%; }
#hud {
  position: absolute; top: 14px; left: 14px; right: 14px;
  display: flex; justify-content: space-between;
  color: var(--hud); font-size: 17px; font-weight: 700;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); pointer-events: none;
}
#msg {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(86%, 340px); padding: 22px 20px; border-radius: 18px;
  background: var(--panel); color: var(--ink); text-align: center;
  line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}
#msg h1 { margin: 0 0 8px; font-size: 28px; }
#msg p { margin: 0; font-size: 15px; }
</style>
</head>
<body>
<div id="hud"><span>Skor <b id="score">0</b></span><span>Terbaik <b id="best">0</b></span></div>
<div id="msg"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));

let best = 0;
try { best = Number(localStorage.getItem('pesawat3d-best')) || 0; } catch (e) {}
$('best').textContent = best;

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 90, 300);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1000);
camera.position.set(0, 9, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3f7d32, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(30, 60, 20);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 1200), new THREE.MeshLambertMaterial({ color: 0x4caf50 }));
ground.rotation.x = -Math.PI / 2;
ground.position.z = -400;
scene.add(ground);

const grid = new THREE.GridHelper(900, 90, 0x2e7d32, 0x2e7d32);
grid.position.y = 0.05;
scene.add(grid);

// ---------- Pesawat ----------
function buildPlane() {
  const g = new THREE.Group();
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const red = mat(0xe74c3c), white = mat(0xf5f5f5), dark = mat(0x34495e), glass = mat(0x5dade2);
  const part = (geo, m, x, y, z, rx = 0) => {
    const o = new THREE.Mesh(geo, m);
    o.position.set(x, y, z);
    o.rotation.x = rx;
    g.add(o);
    return o;
  };
  part(new THREE.CylinderGeometry(0.4, 0.4, 3.4, 12), red, 0, 0, 0, Math.PI / 2);
  part(new THREE.ConeGeometry(0.4, 0.9, 12), red, 0, 0, -2.15, -Math.PI / 2);
  part(new THREE.BoxGeometry(0.7, 0.35, 1.2), glass, 0, 0.42, -0.5);
  part(new THREE.BoxGeometry(6.4, 0.1, 1.3), white, 0, -0.05, -0.2);
  part(new THREE.BoxGeometry(2.2, 0.08, 0.6), white, 0, 0.05, 1.45);
  part(new THREE.BoxGeometry(0.08, 0.9, 0.8), red, 0, 0.5, 1.45);
  const prop = part(new THREE.BoxGeometry(0.12, 2.1, 0.08), dark, 0, 0, -2.7);
  return { group: g, prop };
}
const plane = buildPlane();
plane.group.scale.setScalar(0.85);
scene.add(plane.group);

// ---------- State & objek dunia ----------
const SPAWN_Z = -330, DESPAWN_Z = 16;
const COLORS = [0x8e44ad, 0x2c3e50, 0xd35400, 0x16a085, 0xc0392b];
const items = [], fx = [], P = { x: 0, y: 6 }, target = { x: 0, y: 6 }, keys = {};
let state = 'ready', score = 0, elapsed = 0, speed = 32, spawnT = 0.8, decorT = 0, lockUntil = 0;

function addItem(obj, kind, extra) {
  scene.add(obj);
  items.push(Object.assign({ obj, kind, done: false }, extra));
}
function removeAt(i) {
  const o = items[i].obj;
  scene.remove(o);
  o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
  items.splice(i, 1);
}
function spawnPillar() {
  const w = 2 + Math.random() * 2, h = 4 + Math.random() * 12;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, 4),
    new THREE.MeshLambertMaterial({ color: COLORS[Math.floor(Math.random() * COLORS.length)] })
  );
  m.position.set((Math.random() * 2 - 1) * 8, h / 2, SPAWN_Z);
  addItem(m, 'pillar', { hx: w / 2, top: h });
}
function spawnRingRow() {
  const x = (Math.random() * 2 - 1) * 7, y = 3 + Math.random() * 10;
  for (let i = 0; i < 5; i++) {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(3, 0.25, 8, 24),
      new THREE.MeshLambertMaterial({ color: 0xf1c40f, emissive: 0x553c00 })
    );
    r.position.set(x, y, SPAWN_Z - i * 7);
    addItem(r, 'ring');
  }
}
function spawnDecor(z = SPAWN_Z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x6d4c41 }));
  trunk.position.y = 0.7;
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.6, 4.2, 7), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }));
  top.position.y = 3.4;
  g.add(trunk, top);
  g.scale.setScalar(0.8 + Math.random() * 1.2);
  g.position.set((Math.random() < 0.5 ? -1 : 1) * (17 + Math.random() * 25), 0, z);
  addItem(g, 'decor');
}
function populate() {
  for (let i = 0; i < 16; i++) spawnDecor(-Math.random() * 300);
}

function reset() {
  for (let i = items.length - 1; i >= 0; i--) removeAt(i);
  score = 0; elapsed = 0; speed = 32; spawnT = 0.8; decorT = 0;
  P.x = 0; P.y = 6;
  plane.group.visible = true;
  populate();
}
function showMsg(title, html) {
  const m = $('msg');
  m.innerHTML = '<h1>' + title + '</h1><p>' + html + '</p>';
  m.style.display = 'block';
}
function startGame() {
  if (state === 'play' || performance.now() < lockUntil) return;
  reset();
  state = 'play';
  $('msg').style.display = 'none';
}
function crash() {
  state = 'over';
  plane.group.visible = false;
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.5),
      new THREE.MeshLambertMaterial({ color: i % 2 ? 0xf39c12 : 0xe74c3c })
    );
    m.position.set(P.x, P.y, 0);
    scene.add(m);
    fx.push({ obj: m, v: new THREE.Vector3((Math.random() - 0.5) * 18, Math.random() * 12, (Math.random() - 0.5) * 18), life: 1.4 });
  }
  lockUntil = performance.now() + 700;
  best = Math.max(best, Math.floor(score));
  try { localStorage.setItem('pesawat3d-best', String(best)); } catch (e) {}
  $('best').textContent = best;
  showMsg('Tabrakan!', 'Skor ' + Math.floor(score) + '<br>Ketuk atau tekan Spasi untuk main lagi');
}

function moveWorld(dt) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], o = it.obj;
    o.position.z += speed * dt;
    if (o.position.z > DESPAWN_Z) { removeAt(i); continue; }
    if (it.done) continue;
    const dz = Math.abs(o.position.z);
    if (it.kind === 'pillar') {
      if (dz < 3 && Math.abs(o.position.x - P.x) < it.hx + 1.6 && P.y < it.top + 0.6) { crash(); return; }
    } else if (it.kind === 'ring') {
      if (dz < 2.5 && Math.hypot(o.position.x - P.x, o.position.y - P.y) < 2.4) {
        it.done = true;
        o.visible = false;
        score += 10;
      }
    }
  }
}

// ---------- Update & render ----------
function update(dt) {
  const k = 16 * dt;
  if (keys.ArrowLeft || keys.KeyA) target.x -= k;
  if (keys.ArrowRight || keys.KeyD) target.x += k;
  if (keys.ArrowUp || keys.KeyW) target.y += k;
  if (keys.ArrowDown || keys.KeyS) target.y -= k;
  target.x = clamp(target.x, -11, 11);
  target.y = clamp(target.y, 1.2, 18);

  P.x = damp(P.x, target.x, 6, dt);
  P.y = damp(P.y, target.y, 6, dt);
  const g = plane.group;
  g.position.set(P.x, P.y, 0);
  g.rotation.z = damp(g.rotation.z, clamp(-(target.x - P.x) * 0.06, -0.6, 0.6), 8, dt);
  g.rotation.x = damp(g.rotation.x, clamp((target.y - P.y) * 0.05, -0.35, 0.35), 8, dt);
  plane.prop.rotation.z += dt * 40;

  if (state === 'play') {
    elapsed += dt;
    speed = Math.min(95, 32 + elapsed * 1.5);
    score += speed * dt * 0.1;
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = 1 + Math.random() * 0.7;
      if (Math.random() < 0.5) spawnPillar(); else spawnRingRow();
    }
    decorT -= dt;
    if (decorT <= 0) { decorT = 0.35; spawnDecor(); }
    grid.position.z = (grid.position.z + speed * dt) % 10;
    moveWorld(dt);
  }

  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.life -= dt;
    f.v.y -= 25 * dt;
    f.obj.position.addScaledVector(f.v, dt);
    if (f.obj.position.y < 0.25) { f.obj.position.y = 0.25; f.v.y *= -0.35; }
    f.obj.rotation.x += dt * 9;
    f.obj.rotation.y += dt * 7;
    f.obj.scale.setScalar(Math.max(0.01, f.life));
    if (f.life <= 0) {
      scene.remove(f.obj);
      f.obj.geometry.dispose();
      f.obj.material.dispose();
      fx.splice(i, 1);
    }
  }

  camera.position.x = damp(camera.position.x, P.x * 0.8, 5, dt);
  camera.position.y = damp(camera.position.y, P.y + 3, 5, dt);
  camera.lookAt(camera.position.x, P.y, -15);
  $('score').textContent = Math.floor(score);
}

function resize() {
  const w = document.body.clientWidth, h = document.body.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ---------- Input ----------
function aim(e) {
  target.x = (e.clientX / window.innerWidth - 0.5) * 22;
  target.y = (1 - e.clientY / window.innerHeight) * 16.8 + 1.2;
}
window.addEventListener('pointermove', aim);
window.addEventListener('pointerdown', e => { aim(e); startGame(); });
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') startGame();
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize();
populate();
showMsg('Pesawat 3D', 'Ketuk atau tekan Spasi untuk mulai.<br>Geser layar atau pakai panah / WASD untuk terbang.<br>Ambil cincin emas dan hindari menara.');
requestAnimationFrame(frame);
</script>
</body>
</html>
