<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0614">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <!-- LOAD SCREEN -->
  <div id="loader" aria-live="polite">
    <div class="loader-bg" id="loaderBg"></div>
    <div class="loader-box">
      <div class="loader-ring"><span id="loaderLetter">Y</span><img id="loaderImg" class="loader-img" alt="" referrerpolicy="no-referrer"></div>
      <div class="loader-name" id="loaderName"></div>
      <div class="loader-bar"><i id="loaderBar"></i></div>
      <div class="loader-pct" id="loaderPct">0%</div>
    </div>
  </div>

  <!-- BACKGROUND -->
  <div class="bg" id="bg" aria-hidden="true">
    <div class="bg-media" id="bgMedia"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    <canvas id="sparks"></canvas>
  </div>

  <!-- NAVBAR -->
  <header class="nav" id="nav">
    <a href="#profile" class="brand">
      <b id="brand">Yamzz</b>
      <small id="brandSub">PORTFOLIO</small>
    </a>
    <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose" aria-label="Tutup menu"><i class="fa-solid fa-xmark"></i></button>
    <nav id="drawerLinks">
      <a href="#profile">Profile</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#partners">Partners</a>
      <a href="#contact">Contact</a>
    </nav>
  </aside>

  <main>
    <!-- PROFILE -->
    <section id="profile" class="hero">
      <div class="avatar reveal">
        <img id="avatar" alt="Foto profil" width="170" height="170">
        <b id="avatarFallback" hidden></b>
      </div>
      <div class="status reveal"><i></i><span id="status"></span></div>
      <h1 class="name" id="name"></h1>
      <p class="username" id="username"></p>
      <p class="role" id="role"></p>
      <p class="loc"><i class="fa-solid fa-location-dot"></i> <span id="location"></span></p>
    </section>

    <!-- ABOUT -->
    <section id="about" class="sec">
      <h2 class="title">Tentang Saya</h2>
      <div class="card about-card reveal">
        <p id="aboutText" class="typed"></p><span class="caret" aria-hidden="true"></span>
      </div>
    </section>

    <!-- SKILLS -->
    <section id="skills" class="sec">
      <h2 class="title">My Skills</h2>
      <div class="list" id="skillList"></div>
    </section>

    <!-- PARTNERS -->
    <section id="partners" class="sec">
      <h2 class="title">My Partners</h2>
      <div class="list" id="partnerList"></div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="sec">
      <h2 class="title">Contact</h2>
      <div class="list" id="contactList"></div>
      <p class="based"><i class="fa-solid fa-location-dot"></i> <span id="mapLabel"></span></p>
      <div id="map" class="map reveal"></div>
    </section>
  </main>

  <footer class="footer">Made with <i class="fa-solid fa-heart"></i> <span id="footerText"></span></footer>

  <noscript><p style="padding:2rem;text-align:center">Aktifkan JavaScript buat lihat portfolio ini.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
