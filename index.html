<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bdbdbd">
<title>Fitur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#bdbdbd;--k:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#000;font:14px/1.4 'Space Grotesk',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px 18px 80px}

/* tombol / kotak putih + bayangan hitam + kilau */
.b,.box{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f6f6f6 55%,#e4e4e4 100%);color:#000;border:2px solid #000;border-radius:6px;box-shadow:4px 4px 0 #000}
.b{padding:9px 14px;font-weight:700;font-size:13px;transition:transform .12s,box-shadow .12s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.b:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
.b:active,.b.on{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.b.on{background:linear-gradient(180deg,#d9d9d9,#cfcfcf)}
.b::before,.box::before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.b::after,.box::after{content:"";position:absolute;top:-10%;left:-70%;width:40%;height:120%;pointer-events:none;transform:skewX(-20deg);
background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.08) 30%,rgba(255,255,255,1) 50%,rgba(0,0,0,.08) 70%,rgba(0,0,0,0))}
.b::after{animation:gl 4.2s ease-in-out infinite}
.nav .b:nth-child(2n)::after{animation-delay:.7s}
.nav .b:nth-child(3n)::after{animation-delay:1.5s}
.it:hover::after{animation:gl 1s ease-out 1}
@keyframes gl{0%,60%{left:-70%}100%{left:130%}}
.b>*,.box>*{position:relative;z-index:1}

.top{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:22px}
.logo{font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap}
.srch{flex:1;min-width:0}
.srch input{width:100%;height:40px;padding:0 12px;border:2px solid #000;border-radius:6px;background:#fff;font:inherit;font-size:15px;outline:0;box-shadow:inset 2px 2px 0 rgba(0,0,0,.18)}
.srch input:focus{background:#fffde0}

.nav{display:flex;flex-wrap:nowrap;gap:12px;margin:0 -18px 16px;padding:6px 18px 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;cursor:grab}
.nav::-webkit-scrollbar{display:none}
.nav.drag{cursor:grabbing;scroll-snap-type:none}
.nav .b{flex:none;white-space:nowrap;scroll-snap-align:start}
.nav em{font:500 11px 'IBM Plex Mono',monospace;font-style:normal;background:#000;color:#fff;border-radius:3px;padding:1px 5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.it{cursor:pointer}
.it.open{grid-column:1/-1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px}
.nm{font-weight:700;font-size:15px;text-align:left}
.cp{padding:7px 12px;font-size:12px}
.cp.ok{background:#fff}
.body{display:none;padding:0 12px 14px;cursor:auto}
.it.open .body{display:block}
.inst{display:flex;align-items:center;justify-content:space-between;gap:10px;font:12.5px 'IBM Plex Mono',monospace;margin-bottom:10px;padding:8px 10px;border:2px solid #000;border-radius:6px;background:#fff;overflow-x:auto;white-space:nowrap}
pre{background:#000;color:#f2f2f2;border-radius:6px;padding:14px 16px;overflow:auto;font:12.5px/1.7 'IBM Plex Mono',monospace;max-height:520px;tab-size:2;-webkit-overflow-scrolling:touch}
.cm{color:#8a8a8a}.st{color:#8ee6a0}.kw{color:#ffb86b}.nu{color:#f1d37a}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#000;border:2px solid #000;box-shadow:4px 4px 0 #000;padding:9px 18px;border-radius:6px;font-weight:700;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.logo{font-size:15px}.grid{grid-template-columns:1fr}.top{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top box">
    <div class="logo" id="logo">0 FITUR</div>
    <label class="srch"><input id="q" type="search" placeholder="Cari..." autocomplete="off"></label>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="grid" id="list"></div>
</div>
<div class="toast" id="toast">Tersalin</div>

<script>
const CATS=[['all','Semua'],['dl','Downloader'],['api','API Publik'],['free','API Key Gratis'],['bot','Bot & Server'],['sosmed','Sosmed'],['media','Musik & Media'],['info','Info'],['anime','Anime & Game'],['id','Indonesia'],['dev','Developer'],['tools','Tools'],['fun','Fun']];
const UA="const UA = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36';\n";
const YT="import { execFile } from 'node:child_process';\nimport { promisify } from 'node:util';\nconst run = promisify(execFile);\n\n";

const S=[
/* ---------- DOWNLOADER ---------- */
{cat:'dl',title:'TikTok',desc:'Video tanpa watermark (HD), musik, dan slide foto.',deps:[],code:String.raw`async function tiktok(url) {
  const r = await fetch('https://www.tikwm.com/api/?hd=1&url=' + encodeURIComponent(url));
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.msg || 'Gagal ambil data');
  const d = j.data;
  return {
    title: d.title,
    author: d.author.nickname,
    video: d.hdplay || d.play,
    music: d.music,
    images: d.images || []
  };
}

// contoh:
console.log(await tiktok('https://vt.tiktok.com/xxxxxx'));`},

{cat:'dl',title:'Universal (yt-dlp)',desc:'YouTube, Instagram, Facebook, Twitter, Reddit, dan ribuan situs lain.',deps:['yt-dlp'],install:'pip install -U yt-dlp',code:YT+String.raw`async function ytdlp(url) {
  const { stdout } = await run('yt-dlp', ['-J', '--no-playlist', url], { maxBuffer: 1024 * 1024 * 50 });
  const d = JSON.parse(stdout);
  return {
    title: d.title,
    thumbnail: d.thumbnail,
    duration: d.duration,
    formats: (d.formats || [])
      .filter(f => f.vcodec !== 'none' && f.acodec !== 'none')
      .map(f => ({ quality: f.format_note || f.height, ext: f.ext, url: f.url }))
  };
}

// contoh:
console.log(await ytdlp('https://www.youtube.com/watch?v=dQw4w9WgXcQ'));`},

{cat:'dl',title:'YouTube ke MP3',desc:'Ambil audio dari link YouTube jadi file mp3.',deps:['yt-dlp','ffmpeg'],install:'pkg install yt-dlp ffmpeg',code:YT+String.raw`async function ytmp3(url, out = 'audio') {
  await run('yt-dlp', [
    '-x', '--audio-format', 'mp3', '--audio-quality', '0',
    '--no-playlist', '-o', out + '.%(ext)s', url
  ]);
  return out + '.mp3';
}

// contoh:
console.log(await ytmp3('https://youtu.be/dQw4w9WgXcQ'));`},

{cat:'dl',title:'YouTube ke MP4',desc:'Download video dengan batas resolusi (360, 480, 720, 1080).',deps:['yt-dlp','ffmpeg'],install:'pkg install yt-dlp ffmpeg',code:YT+String.raw`async function ytmp4(url, out = 'video', height = 720) {
  await run('yt-dlp', [
    '-f', 'bv*[height<=' + height + ']+ba/b[height<=' + height + ']',
    '--merge-output-format', 'mp4', '--no-playlist',
    '-o', out + '.%(ext)s', url
  ]);
  return out + '.mp4';
}

// contoh:
console.log(await ytmp4('https://youtu.be/dQw4w9WgXcQ', 'video', 480));`},

{cat:'dl',title:'Instagram (Reels dan Post)',desc:'Download reels dan post publik. Kalau kena limit, pakai cookies browser.',deps:['yt-dlp'],install:'pip install -U yt-dlp',code:YT+String.raw`async function instagram(url, cookiesFile) {
  const args = ['-J', url];
  if (cookiesFile) args.push('--cookies', cookiesFile); // opsional, format Netscape
  const { stdout } = await run('yt-dlp', args, { maxBuffer: 1024 * 1024 * 50 });
  const d = JSON.parse(stdout);
  return (d.entries || [d]).map(e => ({ type: e.ext === 'jpg' ? 'image' : 'video', url: e.url, thumb: e.thumbnail }));
}

// contoh:
console.log(await instagram('https://www.instagram.com/reel/xxxxx/'));`},

{cat:'dl',title:'Facebook Video',desc:'Link direct video Facebook / Reels publik.',deps:['yt-dlp'],install:'pip install -U yt-dlp',code:YT+String.raw`async function facebook(url) {
  const { stdout } = await run('yt-dlp', ['-f', 'best', '-g', '--no-playlist', url]);
  return stdout.trim().split('\n'); // link direct video (+ audio kalau terpisah)
}

// contoh:
console.log(await facebook('https://www.facebook.com/watch/?v=123456789'));`},

{cat:'dl',title:'SoundCloud',desc:'Link audio direct dari track SoundCloud.',deps:['yt-dlp'],install:'pip install -U yt-dlp',code:YT+String.raw`async function soundcloud(url) {
  const { stdout } = await run('yt-dlp', ['-J', url], { maxBuffer: 1024 * 1024 * 20 });
  const d = JSON.parse(stdout);
  return { title: d.title, artist: d.uploader, duration: d.duration, thumbnail: d.thumbnail, audio: d.url };
}

// contoh:
console.log(await soundcloud('https://soundcloud.com/artist/track'));`},

{cat:'dl',title:'Twitter / X',desc:'Foto dan video dari tweet lewat API fxtwitter.',deps:[],code:String.raw`async function twitter(url) {
  const m = url.match(/(?:twitter|x)\.com\/([^/]+)\/status\/(\d+)/);
  if (!m) throw new Error('URL tweet tidak valid');
  const r = await fetch('https://api.fxtwitter.com/' + m[1] + '/status/' + m[2]);
  const { tweet } = await r.json();
  return {
    text: tweet.text,
    author: tweet.author.name,
    photos: (tweet.media?.photos || []).map(p => p.url),
    videos: (tweet.media?.videos || []).map(v => v.url)
  };
}

// contoh:
console.log(await twitter('https://x.com/user/status/1234567890'));`},

{cat:'dl',title:'Reddit',desc:'Gambar atau video dari post Reddit pakai trik .json.',deps:[],code:String.raw`async function reddit(url) {
  const api = url.split('?')[0].replace(/\/$/, '') + '.json';
  const r = await fetch(api, { headers: { 'User-Agent': 'Mozilla/5.0' } });
  const [{ data }] = await r.json();
  const p = data.children[0].data;
  return {
    title: p.title,
    subreddit: p.subreddit,
    image: p.url_overridden_by_dest,
    video: p.secure_media?.reddit_video?.fallback_url || null
  };
}

// contoh:
console.log(await reddit('https://www.reddit.com/r/pics/comments/xxxxx/judul/'));`},

{cat:'dl',title:'Pinterest (pin)',desc:'Gambar dan video dari link pin, termasuk pin.it.',deps:['cheerio'],install:'npm i cheerio',code:UA+String.raw`import * as cheerio from 'cheerio';

async function pinterest(url) {
  const res = await fetch(url, { headers: { 'User-Agent': UA }, redirect: 'follow' });
  const $ = cheerio.load(await res.text());
  const og = p => $('meta[property="og:' + p + '"]').attr('content');
  return { title: og('title'), description: og('description'), image: og('image'), video: og('video') };
}

// contoh:
console.log(await pinterest('https://pin.it/xxxxx'));`},

{cat:'dl',title:'MediaFire',desc:'Link download langsung, nama file, dan ukuran.',deps:['cheerio'],install:'npm i cheerio',code:UA+String.raw`import * as cheerio from 'cheerio';

async function mediafire(url) {
  const res = await fetch(url, { headers: { 'User-Agent': UA } });
  const $ = cheerio.load(await res.text());
  const btn = $('#downloadButton');
  return {
    name: $('.dl-btn-label').attr('title') || $('.filename').first().text().trim(),
    size: (btn.text().match(/\((.*?)\)/) || [])[1],
    link: btn.attr('href')
  };
}

// contoh:
console.log(await mediafire('https://www.mediafire.com/file/xxxxx/file'));`},

{cat:'dl',title:'Google Drive',desc:'Ubah link share Drive jadi link download langsung.',deps:[],code:String.raw`function gdrive(url) {
  const id = (url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/) || [])[1];
  if (!id) throw new Error('ID file tidak ketemu');
  return 'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t';
}

// contoh:
console.log(gdrive('https://drive.google.com/file/d/1AbCdEf/view'));`},

{cat:'dl',title:'GitHub Repo ke ZIP',desc:'Link ZIP repo publik beserta info dasarnya.',deps:[],code:String.raw`async function github(url) {
  const m = url.match(/github\.com\/([^/]+)\/([^/#?]+)/);
  if (!m) throw new Error('URL repo tidak valid');
  const repo = m[2].replace(/\.git$/, '');
  const r = await fetch('https://api.github.com/repos/' + m[1] + '/' + repo, { headers: { 'User-Agent': 'scraper' } });
  const d = await r.json();
  return {
    name: d.full_name,
    stars: d.stargazers_count,
    desc: d.description,
    zip: 'https://api.github.com/repos/' + m[1] + '/' + repo + '/zipball/' + d.default_branch
  };
}

// contoh:
console.log(await github('https://github.com/user/repo'));`},

console.log(await tiktokUser('khaby.lame'));`},

{cat:'sosmed',title:'TikTok Search',desc:'Cari video TikTok berdasarkan kata kunci.',deps:[],code:String.raw`async function tiktokSearch(q, count = 10) {

{cat:'sosmed',title:'Instagram Profile',desc:'Info profil publik: bio, followers, foto profil HD. Sering kena blokir, pakai seperlunya.',deps:[],code:String.raw`async function igProfile(username) {
  const r = await fetch('https://i.instagram.com/api/v1/users/web_profile_info/?username=' + username, {
    headers: { 'x-ig-app-id': '936619743392459', 'User-Agent': 'Mozilla/5.0' }
  });
  if (!r.ok) throw new Error('Diblokir / rate limit: ' + r.status);

  return {

    followers: u.edge_followed_by.count, following: u.edge_follow.count,

  };

// contoh:
console.log(await igProfile('instagram'));`},

{cat:'sosmed',title:'Pinterest Search',desc:'Cari gambar di Pinterest, hasil berupa URL gambar asli.',deps:[],code:String.raw`async function pinSearch(q, limit = 10) {
  const data = JSON.stringify({ options: { query: q, scope: 'pins' }, context: {} });
  const url = 'https://www.pinterest.com/resource/BaseSearchResource/get/?source_url=' +
    encodeURIComponent('/search/pins/?q=' + q) + '&data=' + encodeURIComponent(data);
  const r = await fetch(url, { headers: {
    'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json',
    'X-Pinterest-PWS-Handler': 'www/search/[scope].js'
  } });
  const j = await r.json();
  return j.resource_response.data.results.slice(0, limit).map(p => ({
    title: p.title || p.grid_title,
    image: p.images?.orig?.url,
    link: 'https://pinterest.com/pin/' + p.id
  }));
}

// contoh:
console.log(await pinSearch('wallpaper aesthetic'));`},

{cat:'sosmed',title:'YouTube Search',desc:'Cari video YouTube: judul, channel, durasi, views, thumbnail.',deps:['yt-search'],install:'npm i yt-search',code:String.raw`import yts from 'yt-search';

async function ytsearch(q, limit = 5) {

// contoh:
console.log(await ytsearch('lofi hip hop'));`},

{cat:'sosmed',title:'Spotify Info',desc:'Judul dan cover dari link track, album, atau playlist (oEmbed).',deps:[],code:String.raw`async function spotify(url) {

{cat:'media',title:'Lirik Lagu',desc:'Cari lirik (plain dan synced) lewat LRCLIB.',deps:[],code:String.raw`async function lyrics(query) {

{cat:'media',title:'iTunes Search',desc:'Cari musik, film, atau podcast di Apple (region Indonesia).',deps:[],code:String.raw`async function itunes(q, media = 'music') { // music | movie | podcast | software
  const r = await fetch('https://itunes.apple.com/search?limit=5&country=id&media=' + media + '&term=' + encodeURIComponent(q));

/* ---------- INFO & KAMUS ---------- */
{cat:'info',title:'Wikipedia',desc:'Ringkasan artikel dan thumbnail, bahasa Indonesia.',deps:[],code:String.raw`async function wiki(query) {

{cat:'bot',title:'Baileys: Bot WhatsApp Dasar',desc:'Login QR atau pairing code, auto-reconnect, balas pesan.',deps:['@whiskeysockets/baileys','pino','qrcode-terminal'],install:'npm i @whiskeysockets/baileys pino qrcode-terminal',code:String.raw`import makeWASocket, { useMultiFileAuthState, DisconnectReason, Browsers } from '@whiskeysockets/baileys';
import pino from 'pino';
import qrcode from 'qrcode-terminal';

const NOMOR = ''; // isi 628xxx buat login pakai pairing code, kosongkan buat QR

async function start() {
  const { state, saveCreds } = await useMultiFileAuthState('session');
  const sock = makeWASocket({
    auth: state,
    logger: pino({ level: 'silent' }),
    browser: Browsers.ubuntu('Chrome')
  });

  if (NOMOR && !sock.authState.creds.registered) {
    setTimeout(async () => console.log('Kode pairing:', await sock.requestPairingCode(NOMOR)), 3000);
  }

  sock.ev.on('creds.update', saveCreds);
  sock.ev.on('connection.update', ({ connection, lastDisconnect, qr }) => {
    if (qr && !NOMOR) qrcode.generate(qr, { small: true });
    if (connection === 'open') console.log('Terhubung');
    if (connection === 'close') {
      const code = lastDisconnect?.error?.output?.statusCode;
      if (code !== DisconnectReason.loggedOut) start(); // reconnect
      else console.log('Logout, hapus folder session lalu login ulang');
    }
  });

  sock.ev.on('messages.upsert', async ({ messages }) => {
    const m = messages[0];
    if (!m.message || m.key.fromMe) return;
    const text = m.message.conversation || m.message.extendedTextMessage?.text || '';
    if (text === '.ping') await sock.sendMessage(m.key.remoteJid, { text: 'pong' }, { quoted: m });
  });
}

start();`},

{cat:'bot',title:'Baileys: Handler Command',desc:'Struktur command dengan prefix dan argumen, tinggal tambah fungsi.',deps:['@whiskeysockets/baileys'],install:'npm i @whiskeysockets/baileys',code:String.raw`const prefix = '.';

const commands = {
  ping: async (sock, m) => sock.sendMessage(m.key.remoteJid, { text: 'pong' }, { quoted: m }),
  halo: async (sock, m, args) => sock.sendMessage(m.key.remoteJid, { text: 'Halo ' + (args.join(' ') || 'kak') }, { quoted: m })
  // tambah command di sini
};

export async function handle(sock, m) {
  const msg = m.message || {};
  const text = msg.conversation || msg.extendedTextMessage?.text || msg.imageMessage?.caption || msg.videoMessage?.caption || '';
  if (!text.startsWith(prefix)) return;

  const [cmd, ...args] = text.slice(prefix.length).trim().split(/\s+/);
  const jid = m.key.remoteJid;
  const isGroup = jid.endsWith('@g.us');
  const sender = isGroup ? m.key.participant : jid;

  try {
    await commands[cmd.toLowerCase()]?.(sock, m, args, { isGroup, sender });
  } catch (e) {
    await sock.sendMessage(jid, { text: 'Error: ' + e.message }, { quoted: m });
  }
}

// pasang di: sock.ev.on('messages.upsert', ({ messages }) => handle(sock, messages[0]));`},

{cat:'bot',title:'Express: Jadikan Scraper REST API',desc:'Bungkus fungsi scraper jadi endpoint /api/... dengan JSON seragam.',deps:['express'],install:'npm i express',code:String.raw`import express from 'express';

const app = express();
app.use(express.json());

// ganti dengan fungsi scraper kamu
async function tiktok(url) {
  const j = await (await fetch('https://www.tikwm.com/api/?hd=1&url=' + encodeURIComponent(url))).json();
  if (j.code !== 0) throw new Error(j.msg);
  return { title: j.data.title, video: j.data.hdplay || j.data.play, music: j.data.music };
}

const routes = { tiktok };

app.get('/api/:nama', async (req, res) => {
  const fn = routes[req.params.nama];
  if (!fn) return res.status(404).json({ status: false, error: 'Endpoint tidak ada' });
  try {
    const { url, q } = req.query;
    res.json({ status: true, data: await fn(url || q) });
  } catch (e) {
    res.status(500).json({ status: false, error: e.message });
  }
});

app.get('/', (req, res) => res.json({ endpoints: Object.keys(routes).map(r => '/api/' + r + '?url=') }));

{cat:'bot',title:'Cooldown & Anti-Spam',desc:'Batasi pemakaian per user, cocok untuk bot WA / Telegram.',deps:[],code:String.raw`const last = new Map();

// return sisa detik kalau masih cooldown, 0 kalau boleh
export function cooldown(userId, detik = 5) {
  const now = Date.now();
  const sisa = (last.get(userId) || 0) + detik * 1000 - now;
  if (sisa > 0) return Math.ceil(sisa / 1000);
  last.set(userId, now);
  return 0;
}

const $=id=>document.getElementById(id);
let cat='all',term='';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(code){
  return esc(code).replace(/(\/\/.*$)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|\b(const|let|var|async|await|function|return|import|from|if|throw|new|of|in|try|catch)\b|\b(\d+(?:\.\d+)?)\b/gm,
    (m,c,s,k,n)=>c?'<span class="cm">'+c+'</span>':s?'<span class="st">'+s+'</span>':k?'<span class="kw">'+k+'</span>':'<span class="nu">'+n+'</span>');
}
function toast(){const el=$('toast');el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1200)}
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  toast();
  if(btn){const o=btn.textContent;btn.textContent='OK';setTimeout(()=>{btn.textContent=o},1000)}
}
function installOf(s){return s.install||(s.deps.length?'npm i '+s.deps.join(' '):'')}

S.forEach((s,i)=>s.id=i);
function renderNav(){
  const c={all:S.length};S.forEach(s=>c[s.cat]=(c[s.cat]||0)+1);
  $('nav').innerHTML=CATS.map(([k,v])=>'<button class="b'+(k===cat?' on':'')+'" data-c="'+k+'">'+v+' <em>'+(c[k]||0)+'</em></button>').join('');
}
function render(){
  const t=term.toLowerCase();
  const list=S.filter(s=>(cat==='all'||s.cat===cat)&&(!t||(s.title+' '+s.desc+' '+s.deps.join(' ')).toLowerCase().includes(t)));
  $('list').innerHTML=list.map(s=>{
    const ins=installOf(s);
    return '<div class="it box" data-id="'+s.id+'" title="'+s.desc.replace(/"/g,'&quot;')+'"><div class="row"><span class="nm">'+s.title+'</span>'+
      '<button class="b cp" data-copy="'+s.id+'">Salin</button></div>'+
      '<div class="body">'+(ins?'<div class="inst"><span>$ '+esc(ins)+'</span><button class="b cp" data-inst="'+s.id+'">Salin</button></div>':'')+
      '<pre><code></code></pre></div></div>';
  }).join('')||'<div class="empty">Tidak ada hasil</div>';
  renderNav();
}
$('list').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){e.stopPropagation();copy(S[cp.dataset.copy].code,cp);return}
  const ci=e.target.closest('[data-inst]');
  if(ci){copy(installOf(S[ci.dataset.inst]),ci);return}
  if(e.target.closest('.body'))return;
  const it=e.target.closest('.it');
  if(it){
    const code=it.querySelector('code');
    if(!code.innerHTML)code.innerHTML=hl(S[it.dataset.id].code);
    it.classList.toggle('open');
  }
});
(function(){const n=$('nav');let d=false,x=0,sl=0,moved=false;
n.addEventListener('mousedown',e=>{d=true;moved=false;x=e.pageX;sl=n.scrollLeft});
window.addEventListener('mouseup',()=>{d=false;n.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(!d)return;const dx=e.pageX-x;if(Math.abs(dx)>4){moved=true;n.classList.add('drag')}n.scrollLeft=sl-dx});
n.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false}},true);
n.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){n.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});})();
$('nav').addEventListener('click',e=>{const b=e.target.closest('.b');if(!b)return;cat=b.dataset.c;render()});
$('q').addEventListener('input',e=>{term=e.target.value.trim();render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
$('logo').textContent=S.length+' FITUR';
render();
</script>
</body>
