<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WELCOME DI TRIXRASH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#05050b;color:#fff;font-family:Arial,system-ui,sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.shade{position:fixed;inset:0;background:rgba(0,0,10,.48);z-index:-1}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
.small{font-size:11px;letter-spacing:.35em;color:#ddd8ff;margin-bottom:18px}
h1{font-size:clamp(30px,8vw,64px);font-weight:900;text-shadow:0 0 14px #875cff,0 0 32px #5d7cff;overflow-wrap:anywhere}
.cursor{display:inline-block;width:3px;height:.9em;background:white;margin-left:4px;animation:blink .7s steps(1) infinite}
.line{width:100px;height:3px;background:linear-gradient(90deg,#875cff,#5be7ff);box-shadow:0 0 15px #875cff}
p{font-size:11px;letter-spacing:.2em;color:#ddd;margin-top:18px}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<video autoplay muted loop playsinline>
<source src="VID_20260926_162419_759.mp4" type="video/mp4">
</video><div class="shade"></div>
<main><div class="small">WELCOME TO THE EXPERIENCE</div>
<h1><span id="typed"></span><span class="cursor"></span></h1>
<div class="line"></div><p>TRIXRASH • OFFICIAL PAGE</p></main>
<script>
const msg="WELCOME DI TRIXRASH";let i=0;const el=document.getElementById("typed");
function type(){if(i<=msg.length){el.textContent=msg.slice(0,i++);setTimeout(type,100)}else{setTimeout(()=>{i=0;el.textContent="";type()},2200)}}
type();document.querySelector("video").play().catch(()=>{});
</script>
</body></html>
