<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XETRYMIN PROJECT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <section id="loginPage" class="page active">
    <div class="login-card">
      <div class="typing" id="typingLogin"></div>
      <img src="xetrymin.jpg" class="avatar" alt="XETRYMIN">
      <div class="form">
        <label>USERNAME</label>
        <input id="username" placeholder="Masukkan username" autocomplete="off">
        <label>PASSWORD</label>
        <input id="password" type="password" placeholder="Masukkan password">
        <button id="confirmBtn">KONFIRMASI</button>
      </div>
      <small>Masukkan data bebas untuk melanjutkan.</small>
    </div>
  </section>

  <!-- INTRO VIDEO -->
  <section id="introPage" class="page">
    <video id="introVideo" class="intro-video" src="intro.mp4" playsinline></video>
    <div class="intro-shade"></div>
    <div class="intro-text">
      <h1>XETRYMIN APK</h1>
      <p>THE NEW PROJECT</p>
      <span>BY TANZZURA</span>
    </div>
    <button id="skipBtn" class="skip">→ LEWATI</button>
  </section>

  <!-- HOME -->
  <section id="mainPage" class="page main-page">
    <main id="content"></main>
    <nav class="bottom-nav">
      <button class="nav-btn active-nav" data-tab="home">⌂<span>HOME</span></button>
      <button class="nav-btn" data-tab="tools">⚙<span>TOOLS</span></button>
      <button class="nav-btn" data-tab="game">🎮<span>GAME</span></button>
    </nav>
  </section>

  <!-- VERIFIED OVERLAY -->
  <div id="verifiedOverlay" class="modal">
    <div class="modal-box verify">
      <button class="close" id="closeVerify">×</button>
      <div class="check">✓</div>
      <h2>BERHASIL</h2>
      <p>USER & PASSWORD<br>BERHASIL DI VERIFIKASI</p>
      <button id="goHome">KE HOME MENU</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast">SEGERA HADIR</div>
</div>
<script src="script.js"></script>
</body>
</html>
