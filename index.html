<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #d8d8d8;
    --panel: #f5f5f5;
    --accent: #1a1a1a;
    --accent-fg: #ffffff;
    --error: #b00020;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --fg: #ececec;
      --muted: #9a9a9a;
      --border: #333333;
      --panel: #1f1f1f;
      --accent: #ececec;
      --accent-fg: #161616;
      --error: #ff6b6b;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden; /* Mencegah scroll di body */
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .app {
    max-width: 720px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .app-header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }

  .app-header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  .app-header button:active {
    color: var(--fg);
    border-color: var(--fg);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-fg);
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    color: var(--fg);
  }

  .msg.bot code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    background: rgba(127, 127, 127, 0.15);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .msg.bot pre {
    background: rgba(127, 127, 127, 0.15);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    white-space: pre;
  }

  .msg.bot pre code {
    background: none;
    padding: 0;
  }

  .msg.error {
    align-self: center;
    color: var(--error);
    font-size: 13px;
    background: none;
    padding: 4px;
    text-align: center;
  }

  .composer {
    display: flex;
    gap: 8px;
    padding: 12px 0 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    max-height: 120px;
    min-height: 42px;
  }

  .composer textarea:focus {
    outline: none;
    border-color: var(--fg);
  }

  .composer button {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }

  .composer button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .status {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    text-align: center;
    flex-shrink: 0;
  }

  .status.error {
    color: var(--error);
  }
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <h1>Chat</h1>
    <button id="clearBtn" type="button">Bersihkan</button>
  </header>

  <section id="messages" class="messages" aria-live="polite"></section>

  <form id="chatForm" class="composer">
    <textarea
      id="input"
      rows="1"
      placeholder="Tulis pesan..."
      autocomplete="off"
      required
    ></textarea>
    <button id="sendBtn" type="submit">Kirim</button>
  </form>

  <p id="status" class="status" role="status"></p>
</main>

<script>
// Menggunakan proxy Vercel agar tidak kena blokir Mixed Content
const API_BASE = "/api/proxy";

const messagesEl = document.getElementById("messages");
const formEl = document.getElementById("chatForm");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const statusEl = document.getElementById("status");

let busy = false;

function setStatus(text, isError = false) {
  statusEl.textContent = text || "";
  statusEl.classList.toggle("error", Boolean(isError));
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderBotText(text) {
  const parts = text.split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[a-zA-Z0-9]*\n/, "").trimEnd();
      html += `<pre><code>${escapeHtml(code)}</code></pre>`;
    } else {
      html += escapeHtml(part);
    }
  });
  return html;
}

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  if (role === "bot") {
    div.innerHTML = renderBotText(content);
  } else {
    div.textContent = content;
  }
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function addError(text) {
  const div = document.createElement("div");
  div.className = "msg error";
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
}

async function sendMessage(text) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  setStatus("Menunggu balasan...");

  addMessage("user", text);

  try {
    // Memanggil proxy, bukan langsung ke api.nexadev
    const url = `${API_BASE}?text=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();
    
    if (!data.status || typeof data.result !== "string") {
      throw new Error("Respons tidak valid dari server");
    }
    
    addMessage("bot", data.result);
    setStatus("");
  } catch (err) {
    addError("Gagal menghubungi server: " + err.message);
    setStatus("Terjadi kesalahan", true);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendMessage(text);
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

// Support enter untuk kirim (kecuali shift+enter)
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

clearBtn.addEventListener("click", () => {
  messagesEl.innerHTML = "";
  setStatus("");
  inputEl.focus();
});

// Fokus otomatis saat halaman dibuka
inputEl.focus();
</script>
</body>
</html>
